services:
  app:
    build: .
    env_file: .env
    command: php artisan serve --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: php artisan horizon
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vira
      POSTGRES_USER: vira
      POSTGRES_PASSWORD: vira
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vira -d vira"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

